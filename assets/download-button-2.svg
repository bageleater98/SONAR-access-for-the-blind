<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" role="img" aria-label="Download SONAR, latest release">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63c52a"/>
      <stop offset="0.45" stop-color="#2d9a35"/>
      <stop offset="1" stop-color="#086a34"/>
    </linearGradient>
  </defs>
  <!-- soft grey shadow, offset down and right -->
  <rect x="44" y="52" width="404" height="92" rx="46" fill="#000000" fill-opacity="0.22"/>
  <!-- the button -->
  <rect x="38" y="46" width="404" height="92" rx="46" fill="url(#face)" stroke="#0b6a39" stroke-width="4"/>
  <!-- big white arrow breaking out of the top left, with a dark green outline -->
  <polygon points="86,24 140,24 140,86 168,86 113,160 58,86 86,86" fill="#ffffff" stroke="#0b6a39" stroke-width="5" stroke-linejoin="round"/>
  <!-- text -->
  <text x="294" y="93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff" stroke="#0b6a39" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Download</text>
  <text x="294" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" stroke="#0b6a39" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Sonar - Access for Minecraft</text>
</svg>
