<svg xmlns="http://www.w3.org/2000/svg" width="440" height="100" viewBox="0 0 440 100" role="img" aria-label="Download SONAR, latest release">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be38f"/>
      <stop offset="0.55" stop-color="#2bbf6b"/>
      <stop offset="1" stop-color="#1fa157"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- the darker edge underneath makes the button look raised, like something to press -->
  <rect x="8" y="14" width="424" height="78" rx="39" fill="#13763f" filter="url(#drop)"/>
  <rect x="8" y="8" width="424" height="78" rx="39" fill="url(#face)"/>
  <rect x="8" y="8" width="424" height="78" rx="39" fill="none" stroke="#a8f5c8" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="22" y="12" width="396" height="34" rx="17" fill="url(#shine)"/>
  <!-- download icon -->
  <circle cx="64" cy="47" r="25" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M64 33 v20 M54 45 l10 10 l10 -10" fill="none" stroke="#1fa157" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52 62 h24" fill="none" stroke="#1fa157" stroke-width="5.5" stroke-linecap="round"/>
  <text x="104" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#ffffff" letter-spacing="0.5">Download SONAR</text>
  <text x="104" y="69" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8fff1" fill-opacity="0.95">Latest version for Minecraft 26.3  ·  free</text>
</svg>
